# Routing Configuration - determines which models to use for each task

routing:
  search:
    local_only: true
    description: "Vault search always local (FTS5 + embeddings)"
    
  simple_query:
    providers: []
    description: "No external APIs; answer from Vault context alone"
    
  coding:
    primary: openai
    model: gpt-4o
    fallback: anthropic
    description: "Code generation and refactoring"
    
  legal_review:
    primary: openai
    model: gpt-4o
    secondary: anthropic
    description: "Contract, legal document review"
    
  adversarial:
    primary: xai
    model: grok-2
    description: "Red team, challenger role, opposite arguments"
    
  research:
    primary: openai
    model: gpt-4o
    description: "General research and synthesis"
    
  consistency_check:
    primary: anthropic
    description: "Verify internal consistency"
    
  ai_panel:
    models:
      - provider: openai
        model: gpt-4o
        role: "primary analyst"
      - provider: xai
        model: grok-2
        role: "challenger"
      - provider: anthropic
        model: claude-opus-4-1
        role: "synthesizer (final)"
    description: "Multi-agent analysis panel"
    
  synthesis:
    primary: anthropic
    model: claude-opus-4-1
    description: "Final synthesis and judgment"

confidentiality_overrides:
  strict:
    routing: []
    fallback: "local_only"
    
  confidential:
    routing: [legal_review, consistency_check]
    fallback: "local"
    redact_before_send: true
    
  internal:
    routing: [research, coding, adversarial]
    
  public:
    routing: all
