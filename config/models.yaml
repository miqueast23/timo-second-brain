# Provider Models Configuration

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    default_model: "${OPENAI_MODEL:-gpt-4o}"
    models:
      gpt-4o:
        id: gpt-4o
        tokens: 128000
        vision: true
        type: chat
      gpt-4-turbo:
        id: gpt-4-turbo-preview
        tokens: 128000
        vision: true
        type: chat
      gpt-4:
        id: gpt-4
        tokens: 8192
        vision: false
        type: chat

  xai:
    base_url: "https://api.x.ai/v1"
    api_key_env: "XAI_API_KEY"
    default_model: "${XAI_MODEL:-grok-2}"
    models:
      grok-2:
        id: grok-2-vision-12b
        tokens: 32000
        vision: true
        type: chat
      grok-3:
        id: grok-3
        tokens: 32000
        vision: false
        type: chat

  anthropic:
    api_key_env: "ANTHROPIC_API_KEY"
    default_model: "${ANTHROPIC_MODEL:-claude-opus-4-1}"
    models:
      claude-opus-4-1:
        id: claude-opus-4-1-20250805
        tokens: 200000
        vision: true
        type: chat

  ollama:
    base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    default_model: "${OLLAMA_MODEL:-llama2}"
    models:
      llama2:
        id: llama2
        tokens: 4096
        vision: false
        type: local
      llama2-13b:
        id: llama2:13b
        tokens: 4096
        vision: false
        type: local

roles:
  coding:
    providers: [openai, anthropic]
    models: [gpt-4o, claude-opus-4-1]
    
  legal:
    providers: [openai, anthropic]
    models: [gpt-4o, claude-opus-4-1]
    
  adversarial:
    providers: [xai]
    models: [grok-2]
    
  research:
    providers: [openai, xai, anthropic]
    models: [gpt-4o, grok-2, claude-opus-4-1]
