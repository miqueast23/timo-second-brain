# Permissions Configuration

permissions:
  vault_read:
    allowed: true
    description: "Search and read Vault documents"
    
  vault_write:
    allowed: true
    allowed_folders: ["_AI/Drafts", "_AI/Research", "_AI/Decisions", "_AI/Summaries"]
    denied_folders: ["AI Brain", ".obsidian", ".claude"]
    description: "Write only to _AI subfolders"
    
  vault_modify_original:
    allowed: false
    description: "Modifying original notes requires explicit authorization"
    
  vault_delete:
    allowed: false
    description: "Deletion prohibited"
    
  provider_openai:
    allowed: true
    if_key_present: "OPENAI_API_KEY"
    confidentiality_min: "internal"
    description: "Send to OpenAI per routing"
    
  provider_xai:
    allowed: true
    if_key_present: "XAI_API_KEY"
    confidentiality_min: "internal"
    description: "Send to xAI per routing"
    
  provider_anthropic:
    allowed: false
    reason: "Claude Code is the primary agent; avoid duplicate API calls"
    
  provider_ollama:
    allowed: true
    always_local: true
    description: "Local models, no network"
    
  confidentiality_strict:
    forbidden_providers: [openai, xai, anthropic]
    allowed_providers: [local, claude_code]
    
  confidentiality_confidential:
    allowed_providers: [local, anthropic]
    requires_logging: true
    requires_redaction: true

logging:
  enabled: true
  location: "data/logs"
  format: "jsonl"
  fields:
    - timestamp
    - tool
    - provider
    - model
    - context_size
    - docs_used
    - duration_ms
    - status
    - error
    - cost_estimate
  exclude_fields:
    - api_key
    - full_payload
    - token_breakdown
