# Vault Configuration

vault:
  path: "${VAULT_PATH}"
  vaults:
    - path: "${VAULT_PATH}"
      recursive: true
    - path: "${VAULT_PATH}/Timo Cerebro"
      recursive: true

folders:
  root_alias: "_AI"
  structure:
    inbox: "_AI/Inbox"
    drafts: "_AI/Drafts"
    research: "_AI/Research"
    reviews: "_AI/Reviews"
    decisions: "_AI/Decisions"
    summaries: "_AI/Summaries"
    projects: "_AI/Projects"
    logs: "_AI/Logs"
    system: "_AI/System"

metadata:
  folder_roles:
    CONMEBOL: important
    "Asuntos Abiertos": important
    "AI Brain": protected
    "Clippings": reference
    "02 Asuntos": case
    "03 Personas": person
    "04 Proyectos": project
    "05 Conocimiento": knowledge

confidentiality:
  default_policy: internal
  tags_as_strict:
    - confidential
    - secret
    - oasis
  frontmatter_fields:
    - confidentiality
    - ai_access

file_types:
  text: [md, txt]
  complex: [pdf, docx, xlsx, pptx]
  ignore: [png, jpg, jpeg, gif, mp4, mov, zip, rar]
